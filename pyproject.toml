[project]
name = "receipt-scanner"
version = "0.1.0"
description = "Batch receipt scanner and Google Sheets updater using Gemini Vision AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0.0",
    "pydantic>=2.10.0",
    "gspread>=6.1.4",
    "pillow>=11.0.0",
    "pillow-heif>=0.21.0",
    "python-dotenv>=1.0.1",
    "tenacity>=9.0.0",
    "google-api-python-client>=2.202.0",
    "google-auth-oauthlib>=1.5.0",
    "google-auth-httplib2>=0.4.4",
    "beautifulsoup4>=4.15.0",
]

[project.scripts]
receipt-scanner = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
